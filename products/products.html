<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Merch</title>
    <link rel="stylesheet" href="products.css">
</head>
<body>

    <h1>Star Wars Merchandise</h1>

    <h2>🛒 Cart: <span id="cart-count">0</span></h2>
    
    <div class="products-container">

    <div class="product-card">
        <img src="assets/lightsaber.jpg" alt="Lightsaber">
        <h3>Jedi Lightsaber</h3>
        <p>₹2499</p>
        <button class="cart-btn">Add to Cart</button>
    </div>

    <div class="product-card">
        <img src="assets/helmet.jpg" alt="Darth Vader Helmet">
        <h3>Darth Vader Helmet</h3>
        <p>₹3999</p>
        <button class="cart-btn">Add to Cart</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
